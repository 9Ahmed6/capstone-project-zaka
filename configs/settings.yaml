project:
  name: "Action-Based Video Understanding System"
  version: "week5"

paths:
  output_json_dir: "outputs/json"
  output_clip_dir: "outputs/clips"
  baseline_results: "evaluation/baseline_results.json"

video:
  frame_stride: 1
  max_frames_for_qwen: 8

hand_detection:
  max_num_hands: 2
  min_detection_confidence: 0.5
  min_hand_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  model_path: "models/hand_landmarker.task"
  auto_download_model: true

chunking:
  start_threshold: 0.02
  end_threshold: 0.005
  min_frames: 20

qwen:
  # One Qwen-VL model is used for both text-only and image-aware prompts.
  model_id: "Qwen/Qwen2.5-VL-3B-Instruct"
  max_new_tokens_text: 1200
  max_new_tokens_vision: 1400
  temperature: 0.2

handx:
  # Optional. If this folder does not exist, the code uses a simple fallback.
  diffusion_path: "HandX/diffusion"

rag:
  # RAG over confirmed_actions.json is the only label vocabulary for Qwen-VL.
  confirmed_actions_path: "rag/action_dictionary/confirmed_actions.json"
  top_k: 3
